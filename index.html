<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocateTrade</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #6366f1;
      --text: #ffffff;
      --subtext: #a1a1aa;
      --border: #27272a;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 80px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .lang-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    input, textarea, select { width: 100%; padding: 10px; background: #09090b; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 10px; }
    button { width: 100%; background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.btn-alt { background: transparent; border: 1px solid var(--border); margin-top: 5px; }

    .balance-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
    .price { color: var(--green); font-weight: bold; }
    
    .hidden { display: none; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; border-top: 1px solid var(--border); }
    .nav button { flex: 1; border-radius: 0; background: transparent; padding: 15px 5px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- ХЕДЕР ТА ЗМІНА МОВИ -->
  <div class="header">
    <h2>LocateTrade</h2>
    <button class="lang-btn" onclick="toggleLang()" id="langBtn">RU / UKR</button>
  </div>

  <!-- АВТОРИЗАЦІЯ -->
  <div id="authSection" class="card">
    <h3 id="authTitle">Вход / Авторизация</h3>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPass" placeholder="Пароль">
    <input type="text" id="authName" placeholder="Имя / Ім'я (для регистрации)">
    <button onclick="handleLogin()" id="btnLoginBtn">Войти</button>
    <button class="btn-alt" onclick="handleRegister()" id="btnRegBtn">Зарегистрироваться</button>
  </div>

  <!-- ПРОФІЛЬ ТА БАЛАНС -->
  <div id="profileSection" class="card hidden">
    <div class="balance-info">
      <span>Баланс: <strong id="userBalance" class="price">0</strong> UAH</span>
      <span>Заморожено: <strong id="userFrozen">0</strong> UAH</span>
    </div>
    <button class="btn-alt" onclick="handleLogout()" id="btnLogoutBtn">Выйти</button>
  </div>

  <!-- СТВОРЕННЯ ОГОЛОШЕННЯ -->
  <div id="createSection" class="card hidden">
    <h3 id="createTitle">Создать объявление</h3>
    <input type="text" id="pTitleRu" placeholder="Название (RU)">
    <input type="text" id="pTitleUk" placeholder="Назва (UKR)">
    <textarea id="pDescRu" placeholder="Описание (RU)"></textarea>
    <textarea id="pDescUk" placeholder="Опис (UKR)"></textarea>
    <input type="number" id="pPrice" placeholder="Цена / Ціна (UAH)">
    <input type="text" id="pCategory" placeholder="Категория / Категорія">
    <button onclick="submitListing()" id="btnSubmitListing">Опубликовать</button>
  </div>

  <!-- СПИСОК ОГОЛОШЕНЬ -->
  <div id="feedSection">
    <h3 id="feedTitle">Объявления рядом</h3>
    <div id="listingsContainer">Загрузка...</div>
  </div>

  <!-- НАВІГАЦІЯ ПАНЕЛЬ -->
  <div class="nav">
    <button onclick="showTab('feed')" id="navFeed">Лента</button>
    <button onclick="showTab('create')" id="navCreate">+ Подать</button>
    <button onclick="showTab('profile')" id="navProfile">Кабинет</button>
  </div>

  <script>
    // ІНІЦІАЛІЗАЦІЯ SUPABASE
    const SUPABASE_URL = 'https://tjvdbffdkcteuqlrnfvy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_veSPx-T_yIOUKgUqfaObtQ_kWCa8vIC';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentLang = 'ru'; // Перемикач мови (ru / uk)
    let currentUser = null;

    // ПЕРЕКЛАДИ ТЕКСТІВ
    const dict = {
      ru: {
        authTitle: "Вход / Авторизация", login: "Войти", reg: "Зарегистрироваться",
        createTitle: "Создать объявление", pub: "Опубликовать", feedTitle: "Объявления рядом",
        logout: "Выйти", buy: "Купить (Escrow)", pending: "Ожидает подтверждения"
      },
      uk: {
        authTitle: "Вхід / Авторизація", login: "Увійти", reg: "Зареєструватися",
        createTitle: "Створити оголошення", pub: "Опублікувати", feedTitle: "Оголошення поруч",
        logout: "Вийти", buy: "Купити (Escrow)", pending: "Очікує підтвердження"
      }
    };

    function toggleLang() {
      currentLang = currentLang === 'ru' ? 'uk' : 'ru';
      updateUI();
      loadListings();
    }

    function updateUI() {
      const t = dict[currentLang];
      document.getElementById('authTitle').innerText = t.authTitle;
      document.getElementById('btnLoginBtn').innerText = t.login;
      document.getElementById('btnRegBtn').innerText = t.reg;
      document.getElementById('createTitle').innerText = t.createTitle;
      document.getElementById('btnSubmitListing').innerText = t.pub;
      document.getElementById('feedTitle').innerText = t.feedTitle;
      document.getElementById('btnLogoutBtn').innerText = t.logout;
    }

    // АВТОРИЗАЦІЯ
    async function handleRegister() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPass').value;
      const fullName = document.getElementById('authName').value;

      const { data, error } = await supabase.auth.signUp({
        email, password, options: { data: { full_name: fullName } }
      });
      if (error) alert(error.message);
      else alert("Регистрация успешна! / Реєстрація успішна!");
    }

    async function handleLogin() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPass').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else {
        checkUser();
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      checkUser();
    }

    async function checkUser() {
      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;

      if (user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('profileSection').classList.remove('hidden');
        
        // Отримуємо профіль з балансом
        const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
        if (profile) {
          document.getElementById('userBalance').innerText = profile.balance || 0;
          document.getElementById('userFrozen').innerText = profile.frozen_balance || 0;
        }
      } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('profileSection').classList.add('hidden');
      }
    }

    // СТВОРЕННЯ ОГОЛОШЕННЯ
    async function submitListing() {
      if (!currentUser) return alert("Авторизуйтесь!");

      const listing = {
        user_id: currentUser.id,
        title_ru: document.getElementById('pTitleRu').value,
        title_uk: document.getElementById('pTitleUk').value || document.getElementById('pTitleRu').value,
        description_ru: document.getElementById('pDescRu').value,
        description_uk: document.getElementById('pDescUk').value || document.getElementById('pDescRu').value,
        price: parseFloat(document.getElementById('pPrice').value),
        category: document.getElementById('pCategory').value,
        latitude: 50.45, // Дефолтні координати
        longitude: 30.52
      };

      const { error } = await supabase.from('listings').insert([listing]);
      if (error) alert(error.message);
      else {
        alert("Создано! / Створено!");
        showTab('feed');
        loadListings();
      }
    }

    // ЗАВАНТАЖЕННЯ ОГОЛОШЕНЬ
    async function loadListings() {
      const container = document.getElementById('listingsContainer');
      const { data, error } = await supabase.from('listings').select('*').eq('status', 'active');

      if (error) { container.innerText = "Ошибка загрузки"; return; }
      if (!data || data.length === 0) { container.innerText = "Нет объявлений"; return; }

      container.innerHTML = '';
      data.forEach(item => {
        const title = currentLang === 'uk' ? item.title_uk : item.title_ru;
        const desc = currentLang === 'uk' ? item.description_uk : item.description_ru;

        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <h4>${title}</h4>
          <p style="color:var(--subtext); font-size:14px; margin: 5px 0;">${desc}</p>
          <div class="price">${item.price} UAH</div>
          <button onclick="startDeal('${item.id}', '${item.user_id}', ${item.price})" style="margin-top:10px;">
            ${dict[currentLang].buy}
          </button>
        `;
        container.appendChild(el);
      });
    }

    // ІНІЦІАЦІЯ УГОДИ (ESCROW)
    async function startDeal(listingId, sellerId, amount) {
      if (!currentUser) return alert("Авторизуйтесь!");
      
      const { data, error } = await supabase.rpc('create_deal', {
        p_listing_id: listingId,
        p_seller_id: sellerId,
        p_amount: amount
      });

      if (error) alert(error.message);
      else {
        alert("Сделка создана! Средства заморожены. / Угоду створено! Кошти заморожено.");
        checkUser();
      }
    }

    // НАВІГАЦІЯ
    function showTab(tab) {
      document.getElementById('feedSection').classList.add('hidden');
      document.getElementById('createSection').classList.add('hidden');
      
      if (tab === 'feed') document.getElementById('feedSection').classList.remove('hidden');
      if (tab === 'create') document.getElementById('createSection').classList.remove('hidden');
    }

    // СТАРТ
    checkUser();
    loadListings();
    updateUI();
  </script>
</body>
</html>
